# Runs on every pull request (and on main) so a broken change is caught before review.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
